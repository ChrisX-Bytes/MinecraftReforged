name: Run Headless Main
on:
  push:
    branches: [ fix/mc-fluid-sim-async-mesh-2026-08-01 ]
  pull_request:
    branches: [ main ]
jobs:
  run-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install numpy pygame PyOpenGL || true
      - name: Run headless main
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -s "-screen 0 1024x768x24" python main.py > out.log 2>&1 || true
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: out.log